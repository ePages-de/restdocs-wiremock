dependencies {
    // See https://github.com/spring-projects/spring-restdocs/releases/tag/v3.0.0
    implementation 'org.springframework.restdocs:spring-restdocs-core:3.0.1'
    implementation 'org.springframework:spring-web:6.1.12'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.2'
    compileOnly 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
    testImplementation 'com.google.guava:guava:33.2.1-jre'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

group = 'com.epages'
description = 'Adds WireMock stub snippets to Spring REST Docs'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId 'restdocs-wiremock'
            groupId = project.group

            pom {
                  name = 'REST Docs WireMock'
                  description = 'Spring REST Docs WireMock Integration'
                  url = 'https://github.com/ePages-de/restdocs-wiremock'
                  licenses {
                      license {
                          name = 'The Apache License, Version 2.0'
                          url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                      }
                  }
                  developers {
                      developer {
                          id = 'ePages'
                          name = 'ePages Devs'
                          email = 'info@epages.com'
                      }
                  }
                  scm {
                      connection = 'scm:git:git://github.com:ePages-de/restdocs-wiremock.git'
                      developerConnection = 'scm:git:ssh://github.com:ePages-de/restdocs-wiremock.git'
                      url = 'https://github.com/ePages-de/restdocs-wiremock'
                  }
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
    sign configurations.archives
}
