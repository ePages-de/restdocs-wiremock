dependencyManagement {
    imports {
        mavenBom 'org.junit:junit-bom:6.1.3'
    }
}

dependencies {
    // See https://github.com/spring-projects/spring-restdocs/releases/tag/v4.0.1
    implementation 'org.springframework.restdocs:spring-restdocs-core:4.0.1'
    implementation 'org.springframework:spring-web:7.0.9'
    implementation 'com.jayway.jsonpath:json-path:3.0.0'
    implementation 'tools.jackson.core:jackson-databind:3.2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
    testImplementation 'com.google.guava:guava:33.7.1-jre'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'com.samskivert:jmustache:1.16'
}

group = 'com.epages'
description = 'Adds WireMock stub snippets to Spring REST Docs'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId 'restdocs-wiremock'
            groupId = project.group

            pom {
                  name = 'REST Docs WireMock'
                  description = 'Spring REST Docs WireMock Integration'
                  url = 'https://github.com/ePages-de/restdocs-wiremock'
                  licenses {
                      license {
                          name = 'The Apache License, Version 2.0'
                          url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                      }
                  }
                  developers {
                      developer {
                          id = 'ePages'
                          name = 'ePages Devs'
                          email = 'info@epages.com'
                      }
                  }
                  scm {
                      connection = 'scm:git:git://github.com:ePages-de/restdocs-wiremock.git'
                      developerConnection = 'scm:git:ssh://github.com:ePages-de/restdocs-wiremock.git'
                      url = 'https://github.com/ePages-de/restdocs-wiremock'
                  }
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
    sign configurations.archives
}
